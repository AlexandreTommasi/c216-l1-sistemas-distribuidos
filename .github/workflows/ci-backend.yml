name: CI Backend

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: c216
          POSTGRES_PASSWORD: c216
          POSTGRES_DB: c216_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U c216 -d c216_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+psycopg://c216:c216@localhost:5432/c216_test

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout do codigo
        uses: actions/checkout@v4

      - name: Configura o Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Instala o Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Cache das dependencias
        uses: actions/cache@v4
        with:
          path: backend/.venv
          key: poetry-${{ runner.os }}-${{ hashFiles('backend/poetry.lock') }}
          restore-keys: |
            poetry-${{ runner.os }}-

      - name: Instala as dependencias
        run: poetry install

      - name: Aplica as migrations
        run: poetry run alembic upgrade head

      - name: Testes unitarios
        run: poetry run pytest tests -m unit -v

      - name: Testes de integracao
        run: poetry run pytest tests -m integration -v
