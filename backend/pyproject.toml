[project]
name = "overload"
version = "0.1.0"
description = "Registro de treino de musculação com evolução por exercício"
authors = [
    {name = "AlexandreTommasi"}
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.0",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.14.0",
    "pydantic-settings>=2.6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "httpx>=0.28.0",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
packages = [{include = "overload", from = "src"}]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["overload", "tests"]
known-third-party = ["alembic", "sqlalchemy", "fastapi", "uvicorn", "pydantic", "pydantic_settings"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=overload --cov-report=term-missing"
pythonpath = ["src", "."]
markers = [
    "unit: unit tests that run without a database",
]
